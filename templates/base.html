<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cognito Login{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f1ec; color: #1d1d1f;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; border-radius: 16px; padding: 40px; max-width: 520px; width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    .tag { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
           color: #b4541a; font-weight: 600; margin-bottom: 12px; }
    h1 { font-size: 28px; margin-bottom: 10px; }
    p { color: #555; line-height: 1.5; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 12px 22px; border-radius: 10px; text-decoration: none;
           font-weight: 600; background: #1d1d1f; color: #fff; }
    .btn.secondary { background: #eee; color: #1d1d1f; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 24px; }
    td { padding: 8px 6px; border-bottom: 1px solid #eee; word-break: break-all; vertical-align: top; }
    td:first-child { font-family: monospace; color: #b4541a; width: 34%; }
    footer { margin-top: 28px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
    <footer>IMAP Group Project · Django + AWS Cognito</footer>
  </div>
</body>
</html>
